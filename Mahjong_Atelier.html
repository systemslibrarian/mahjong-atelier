<script>
(function (/** @type {Atelier.Registry} */ M) {
  'use strict';
  /** @type {Atelier.Suit[]} */
  const SUITS = ['b','d','c'];
  /** @type {Atelier.HonorCode[]} */
  const HONORS = ['we','ws','ww','wn','dr','dg','dw'];
  /** @type {Atelier.Rank[]} */
  const RANKS = [1,2,3,4,5,6,7,8,9];
  /** @type {Atelier.BonusTileCode[]} */
  const BONUS_TYPES = ['f1','f2','f3','f4','f5','f6','f7','f8'];
  /** @param {Atelier.Suit} suit @param {Atelier.Rank} rank @returns {Atelier.StandardTileCode} */
  function suitFace(suit,rank){return `${suit}${rank}`;}
  /** @type {Atelier.StandardTileCode[]} */
  const STANDARD_TYPES = [...SUITS.flatMap(s => RANKS.map(rank=>suitFace(s,rank))), ...HONORS];
  /** @type {Record<string,string>} */
  const SUIT_NAMES={b:'Bamboo', d:'Dots', c:'Characters'};
  /** @type {Record<string,string>} */
  const WIND_NAMES={we:'East wind',ws:'South wind',ww:'West wind',wn:'North wind'};
  /** @type {Record<string,string>} */
  const DRAGON_NAMES={dr:'Red dragon',dg:'Green dragon',dw:'White dragon'};
  /** @type {Record<string,string>} */
  const TITLES={...WIND_NAMES,...DRAGON_NAMES,j:'Joker'};

  discards:g.players.flatMap(p=>p.discards.map(copyTile)),publicMelds:g.players.flatMap(p=>p.seat===seat?p.melds.map(copyMeld):p.melds.filter(m=>!m.concealed).map(copyMeld)),
  expanded:!!g.expanded,minFan:g.minFan||0,seatWind:g.windIndex(seat),prevailing:g.round,flowersEnabled:!!g.flowersEnabled,sevenPairs:!!g.settings.sevenPairs,
  wallCount:g.wall.length,lastSource:g.lastSource,latest:g.lastDiscard?{type:g.lastDiscard.tile.type,by:g.lastDiscard.by}:null};
}
/** @param {Atelier.PublicView} v @param {Atelier.Tile[]} tiles @returns {Atelier.CoachAnalysis|null} */
function winForView(v,tiles){
 if(v.variant==='american'){const card=AM.winningPatterns(tiles,v.melds)[0];return card?{card}:null;}
 /** @type {Atelier.ScoreContext} */
 const context={seat:v.seatWind,prevailing:v.prevailing,selfDraw:true,flowers:v.flowers,flowersEnabled:v.flowersEnabled,source:'draw',lastWall:false,heavenly:false,earthly:false,sevenPairs:v.sevenPairs};
 const values=HK.partitions(tiles,v.melds).map(p=>v.expanded?HK.extendedScore(p,v.melds,tiles,context):HK.fanScore(p,v.melds,v.seatWind,true,v.prevailing));
 if(v.expanded)values.push(...HK.specialHands(tiles,v.melds,context));return values.filter(a=>(a.qualifyingFan??a.fan)>=v.minFan).sort((a,b)=>b.fan-a.fan)[0]||null;
}
/** @param {Atelier.PublicView} v @returns {Record<string,number>} */
function knownCounts(v){return C.countTypes([...v.hand,...v.discards,...v.publicMelds.flatMap(m=>m.tiles)]);}
/** @param {Atelier.Tile[]} hand @param {Atelier.Tile} t @param {Atelier.Variant} variant @returns {Atelier.Support} */
function support(hand,t,variant){const same=hand.filter(x=>x.type===t.type).length-1;let adjacent=0,gapped=0;if(variant==='hk'&&/^[bdc][1-9]$/.test(t.type))for(const o of hand){if(o.type[0]!==t.type[0])continue;const d=Math.abs(+o.type.slice(1)-+t.type.slice(1));if(d===1)adjacent++;if(d===2)gapped++;}return {same,adjacent,gapped,cost:same*3+adjacent*1.35+gapped*.6+(t.type==='j'?100:0)};}
/** @param {Atelier.PublicView} v @returns {Atelier.Alternative[]} */
function alternatives(v){
 if(v.phase!=='discard'||v.current!==v.seat)return [];
 const known=knownCounts(v);
 /** @type {Atelier.TileCode[]} */
 const types=v.variant==='american'?[...C.STANDARD_TYPES,'j','f1','f2','f3','f4','f5','f6','f7','f8']:[...C.STANDARD_TYPES];
 return [...new Map(v.hand.map(t=>[t.type,t])).values()].map(tile=>{
  const remaining=v.hand.filter(t=>t.id!==tile.id),s=support(v.hand,tile,v.variant);
  /** @type {Atelier.Wait[]} */
  const waits=[];
  for(const type of v.wallCount===0?[]:types){const total=type==='j'?8:type[0]==='f'?1:4,unseen=Math.max(0,total-(known[type]||0));if(!unseen)continue;const analysis=winForView(v,[...remaining,{id:-1,type}]);if(analysis)waits.push({type,unseen,fan:analysis.fan??null,pattern:analysis.card?.name??null});}
  const visibleDiscardCount=v.discards.filter(t=>t.type===tile.type).length;
  return {id:tile.id,type:tile.type,waits,unseenWinning:waits.reduce((n,w)=>n+w.unseen,0),support:s,
   rule:`Discarding ${C.name(tile.type)} is legal on your discard turn.`,
   calculation:v.wallCount===0?`Keeps ${remaining.length} concealed tiles. The wall is empty, so no later self-draw is possible. ${tile.type==='j'?'A discarded Joker cannot be claimed.':'A legal final-discard claim may still end the hand.'}`:`Keeps ${remaining.length} concealed tiles. ${waits.length} tile type${waits.length===1?'':'s'} could complete a legal hand on a later ordinary self-draw (${waits.reduce((n,w)=>n+w.unseen,0)} copies not accounted for in your hand and visible tiles).`,
   heuristic:s.same?`Giving up a duplicate reduces a ${s.same+1}-tile group. Compare whether its tiles serve another structure.`:v.variant==='hk'&&(s.adjacent||s.gapped)?`This tile has ${s.adjacent} adjacent and ${s.gapped} one-gap suit partner(s). Keeping it may preserve sequence routes.`:tile.type==='j'?'A Joker is flexible in large American groups; discarding it usually gives up useful options.':'This tile has little local support in the current rack. Discarding it may preserve stronger groups.',
   defense:`${visibleDiscardCount} matching tile${visibleDiscardCount===1?' has':'s have'} already been discarded. That is visible information, not proof this discard is safe.`};
 }).sort((a,b)=>b.unseenWinning-a.unseenWinning||a.support.cost-b.support.cost||a.type.localeCompare(b.type));
}
/** @param {Atelier.SolitaireGeometry} g @returns {Atelier.SolitaireChoice[]} */
function solitaireChoices(g){
 if(!solitaireDependency)throw Error('Load solitaire.js before using Solitaire coaching');
 const S=solitaireDependency;
 const before=new Set(g.available().map(t=>t.id));
 return g.pairs().map(ids=>{const remaining=g.tiles.filter(t=>!t.removed&&!ids.includes(t.id));const occ=new Map(remaining.map(t=>[t.id,t]));const newly=remaining.filter(t=>!before.has(t.id)&&S.free(t,occ)).map(t=>t.id);return {ids,newly,rule:'Both tiles are free and their matching keys agree.',calculation:`Removing this pair makes ${newly.length} previously blocked tile${newly.length===1?'':'s'} free.`,heuristic:'Opening more tiles may give you more choices. This one-step count does not prove the whole board can be cleared.'};}).sort((a,b)=>b.newly.length-a.newly.length);
}
/** @param {Atelier.HongKongTable|Atelier.AmericanTable} g @param {number} seat @returns {string} */
function actionRule(g,seat){
 if(g.phase==='finished')return 'This hand is finished. Read the score breakdown, then choose Next hand.';
 if(g.phase==='opening')return 'East checks the dealt 14 tiles before any pass. A complete original-card hand may win immediately; otherwise Charleston begins.';
 if(g.phase==='passingWin')return 'The three-pass round is complete. East may declare a complete original-card hand at this boundary; no round is interrupted midway.';
 if(g.phase==='blindDeadlock')return 'A blind pass needs incoming tiles. Rechoose first left with at least one rack tile contributed; all racks are unchanged.';
 if(g.phase==='secondChoice')return 'Every player chooses. The second Charleston occurs only with unanimous agreement.';
 if(g.phase==='courtesyChoice')return 'Offer 0–3 tiles. Each opposite pair exchanges the smaller offer; zero declines.';
 if(g.phase==='charleston'&&g.variant==='american')return `Select ${g.passCount(seat)} non-Joker tiles in total${g.canBlind()?', including any incoming tiles you choose to pass blind':''}. Passing a Joker is illegal.`;
 if(g.phase==='robkong')return 'Only a complete qualifying win may take the proposed fourth tile. You cannot claim it for a meld.';
 if(g.phase==='claims')return g.variant==='hk'?'The banner lists claims the engine has verified for your rack. Chow is limited to the preceding seat; Pung/Kong can use any latest discard; Mahjong takes priority.'+(g.expanded?' Thirteen Orphans outranks ordinary wins here. Declining a win blocks another win on the same discarded type until your own next draw.':''):'The banner lists verified claims. A set must fit an exposed original-card row; singles/pairs may use a discard only for a complete win. Discarded Jokers cannot be claimed.';
 return g.variant==='hk'?'Select any rack tile to discard, or declare an eligible winning hand. Kong options appear only when the engine permits them.':'Select a rack tile to discard, redeem an eligible exposed Joker, or declare a complete original-card hand. No Chow calls and no Joker pairs.';
}
M.coach={publicView,winForView,knownCounts,support,alternatives,solitaireChoices,actionRule};
})(globalThis.Mahjong=globalThis.Mahjong||{});

(function(M){
'use strict';
const row=(types,label)=>`<figure class="lesson-example"><div class="lesson-tiles">${types.split(' ').map(t=>`<span class="mj-tile" role="img" aria-label="${M.core.name(t)}">${M.core.tileMarkup(t)}</span>`).join('')}</div><figcaption>${label}</figcaption></figure>`;
const lesson=(title,body)=>({title,body});
const courses={
solitaire:{name:'Mahjong Solitaire',intro:'A solo matching puzzle. Learn to read the layers, choose useful pairs, and recover from a dead end.',lessons:[
lesson('Your first pair',()=>`<p>Your goal is to remove all 144 tiles as 72 pairs. There are no opponents, draws, discards, or scoring hands. The three layouts change the shape of the puzzle, not the matching rules.</p><ol><li>Find two matching tiles that are both free.</li><li>Select the first tile, then the second. A legal pair disappears.</li><li>Look again: removing a pair may uncover new tiles or open a side.</li><li>Continue until the board is empty.</li></ol>${row('d5 d5','A matching pair: two 5-Dots.')}<p>Two tiles with the same number but different suits do not match. Selecting a nonmatching tile changes your selection; it does not remove tiles.</p>`),
lesson('What makes a tile free?',()=>`<p>A tile must pass <strong>both</strong> tests: nothing overlaps it from above, and at least one horizontal side—left or right—is open. Open space above or below on the screen does not count as an open side.</p><ul><li>Uncovered, left side open, right side blocked: free.</li><li>Uncovered, both horizontal sides blocked: blocked.</li><li>Left side open but another tile rests on it: blocked.</li></ul><p>The board dims blocked tiles. On a narrow screen, scroll the board sideways to inspect the edges. A matching picture is not enough: both copies must be free at the same time.</p>`),
lesson('Flowers and Seasons',()=>`<p>Numbered tiles, Winds, and Dragons match identical faces. Bonus tiles are the exception: any Flower matches another Flower, and any Season matches another Season. A Flower does not match a Season.</p>${row('f1 f2','Plum + Orchid: a legal Flower pair.')}${row('f5 f8','Spring + Winter: a legal Season pair.')}${row('we we dr dr','East matches East; Red Dragon matches Red Dragon. Honors are not interchangeable.')}<p>The tile library and English indices help identify unfamiliar faces. Changing the visual theme never changes a match.</p>`),
lesson('Think one move ahead',()=>`<p>Before taking an obvious pair, ask what it will release. Favor pairs that uncover a stack or unlock a long row. A pair of isolated tiles may be safe to leave until later.</p><p>If three identical tiles are free, compare all three possible pairings. Removing two easy edge tiles may leave the third trapped behind the only remaining copy. Choose the pairing that opens the most useful space.</p><p>Look for tiles directly above needed matches. Work across the board rather than clearing one corner automatically. Each initial deal has a clearing sequence, but not every sequence of choices succeeds.</p>`),
lesson('Hints, undo, and a practice routine',()=>`<p><strong>Hint</strong> highlights an available pair; it does not promise the best long-term move. <strong>Undo</strong> restores the last removed pair so you can compare another choice. <strong>Shuffle</strong> rearranges remaining tiles into a solvable arrangement and clears undo history; a trapped shape may become an open rescue tray.</p><ol><li>Play five pairs without a hint. Say what each removal opens.</li><li>Use Hint and explain why both highlighted tiles are free.</li><li>Undo a pair and try a different pairing. Compare the new openings.</li></ol><p>New puzzle and changing the layout replace the current puzzle. Your goal is understanding the board, not beating the clock. For matching-rule background, see the <a href="https://docs.kde.org/stable_kf6/en/kmahjongg/kmahjongg/rules.html" target="_blank" rel="noopener noreferrer">KMahjongg rules</a>. Atelier’s layouts, artwork, and explanations are independently created; its initial deals deliberately have a clearing sequence.</p>`)
],question:'A tile has an open left side, but another tile overlaps it from above. Can you remove it?',choices:['Yes, one open side is enough','No, it must also be uncovered'],answer:1,why:'Both conditions are required: uncovered from above AND at least one horizontal side open.'},
hongkong:{name:'Hong Kong Mahjong',intro:'Learn the draw-and-discard game, then explore the named Atelier rules profile. Beginner mode remains available.',lessons:[
lesson('Tiles, profiles, and a complete hand',()=>`<p>Both profiles use four players and 136 standard tiles: four walls of 17 two-tile stacks. With eight bonus tiles, each wall has 18 stacks. The app automates shuffling, dealing, and replacement draws. Atelier can add eight Flowers and Seasons: these are exposed automatically and replaced, never used in melds. Start with zero minimum faan; move to three when ready.</p><p>A standard winning hand has four melds plus a pair. Each tile belongs to one group. A Kong is one meld containing four physical tiles; its replacement draw means a winning hand with Kongs contains more than 14 physical tiles.</p>${row('b1 b2 b3 d4 d5 d6 c7 c8 c9 dr dr dr we we','Three Chows + a Dragon Pung + an East pair.')}<p>Atelier also recognizes special hands. Beginner accepts only the standard shape and uses the smaller scoring model.</p>`),
lesson('A turn and a claim',()=>`<ol><li>East starts with 14 tiles and may declare a qualifying opening win; otherwise East discards first. Others start with 13.</li><li>The next player draws automatically, checks for a win, then selects and discards a tile.</li><li>Other players may claim the latest discard. Earlier discards are unavailable.</li><li>After calling Chow or Pung, discard without drawing again. A Kong receives a replacement.</li></ol><p>Mahjong claims outrank all meld claims. Pung and Kong share priority above Chow; equal-priority claims go to the next eligible player in turn order. This profile awards one winner per hand. In Atelier v2, Thirteen Orphans takes precedence over an ordinary winning claim; otherwise equal claims follow turn order. If you decline a qualifying win, you cannot win on another discard of that same tile type until your own next draw. Other waiting types remain eligible. Beginner omits these two advanced conventions. This is not Riichi furiten.</p><p>The action banner shows your legal choices. In local play, hand the device over behind the privacy screen. Draws, shuffling, and dealing are automatic.</p>`),
lesson('Build melds and flexible waits',()=>`${row('b3 b4 b5','Chow: three consecutive numbers, all in one suit.')}${row('dg dg dg','Pung: three identical tiles.')}${row('d8 d8 d8 d8','Kong: four identical tiles, declared as one meld.')}<p>A Chow claim can use only the immediately preceding player’s discard. A Pung or Kong can use any opponent’s latest discard. Honors do not form sequences. Neither 8–9–1 nor mixed suits make a Chow.</p><p>Holding 4–5 gives two possible completions: 3 or 6. Holding 4–6 needs 5. Keep flexible shapes where practical, but also preserve a pair. A completed group is not a complete hand by itself.</p>`),
lesson('Added Kongs and robbing',()=>`<p>After a draw, four identical rack tiles may become a concealed Kong. In Atelier, a natural fourth tile can also upgrade your own exposed Pung: choose <strong>Add to Pung</strong>. It stays one meld.</p><p>Before that upgrade completes, every eligible opponent may claim the proposed fourth tile to win. This is robbing an added Kong. If someone wins, the original Pung stays a Pung, the fourth tile goes to the winner, and no replacement is drawn. If everyone passes, the Kong completes and gets its replacement.</p><p>This profile does not permit robbing a concealed Kong. Kong declarations require a replacement tile to remain in the wall. You cannot declare an unrelated concealed or added Kong immediately after calling Chow or Pung.</p>`),
lesson('Special hands and the house option',()=>`<p>Atelier recognizes Thirteen Orphans (all thirteen distinct terminals and honors plus a duplicate), Nine Gates (one suit: three 1s, one each 2–8, three 9s, plus one more tile), and several rare standard shapes.</p>${row('b1 b9 c1 c9 d1 d9 we ws ww wn dr dg dw we','Thirteen Orphans: thirteen distinct terminal/honor types and one duplicate. No exposures.')}<p>Fixed 10-faan hands: Thirteen Orphans, Nine Gates, All Honors, All Terminals, Little/Big Four Winds, Three Great Scholars, Four Kongs, four concealed Pungs on self-draw, Heavenly Hand, Earthly Hand, and Jade/Ruby/Pearl Dragon. Little Three Dragons is fixed at 4 faan. Fixed scores do not stack with other bonuses.</p><p>Heavenly means East wins the initial dealt hand; Earthly means winning on the first discard without an intervening call. Jade/Ruby/Pearl require the matching Dragon Pung, three Pungs of Bamboo/Characters/Dots respectively, and a pair in that suit.</p><p><strong>Seven distinct pairs</strong> is an optional 4-faan house rule, off by default. Seven different types must occur exactly twice; a four-of-a-kind is not two pairs. It allows no exposures and is not presented as universal Hong Kong practice.</p>`),
lesson('Read the score breakdown',()=>`<p>Atelier’s regular scoring adds: each Dragon set 1; seat-wind set 1; prevailing-wind set 1; all Chows with a suited pair 1; all Pungs/Kongs 3; one suit with honors 3; one suit without honors 6; self-draw 1; Kong replacement 1; robbing an added Kong 1; last wall tile or last discard 1. The total is capped at 10. An honor pair does not earn the all-Chows point in this profile. Last-discard bonus applies only to the discard immediately after the final wall draw, not later discards produced by Pung/Chow claims.</p><p>If Flowers are enabled: no bonus tiles gives 1; your own numbered Flower and Season each give 1; each complete four-tile bonus family gives 2, including its own-Flower/Season point rather than adding that point again. As an explicit Atelier minimum-score convention, these bonuses are applied only <strong>after</strong> checking the minimum qualifying faan. Disabling Flowers also disables the no-Flower bonus.</p><p>A Dragon pair earns no Dragon-set point. An East Pung while you are East in the East round earns both wind points. Fixed special-hand scores are evaluated separately, and the engine chooses the highest eligible interpretation.</p><p>Beginner uses only Dragon/wind sets, all Chows/Pungs, flushes, and self-draw. It has no special hands or Flower scoring.</p>`),
lesson('Points, rounds, and continuing a match',()=>`<div class="lesson-table"><table><thead><tr><th>Atelier faan</th><th>Base points</th></tr></thead><tbody>${[[0,1],[1,2],[2,4],[3,8],['4–6',16],['7–9',32],['10',64]].map(([f,p])=>`<tr><td>${f}</td><td>${p}</td></tr>`).join('')}</tbody></table></div><p>On a discard win, the discarder pays twice the base and the other two players each pay the base. On self-draw, all three opponents pay twice the base. Example: 3 faan means base 8; a discard win receives 16 + 8 + 8 = 32. All points are virtual and the ledger sums to zero.</p><p>Choose <strong>Next hand</strong> to retain the ledger. East remains dealer after an East win or a drawn hand. Otherwise the dealer advances. After four dealer advances the prevailing wind changes; completing East, South, West, and North rounds ends the match. Players remain in their physical positions while their seat winds change.</p><p>Beginner uses a teaching base of 2 to the power of faan, capped at 64. A New match resets points and rounds.</p>`),
lesson('Strategy, practice, and rule sources',()=>`<ol><li>Start at zero minimum and identify four potential melds and a pair before discarding.</li><li>Compare open-ended and closed waits. Count visible copies before relying on a tile.</li><li>Try three qualifying faan. Choose a credible route before exposing sets.</li><li>Open Guided practice to discard an isolated tile, finish a staged hand, and declare a Kong.</li></ol><p>House conventions differ. Atelier uses an explicit profile rather than claiming one universal or tournament ruleset. The wall is one finite pool with replacements drawn from its back; there is no separate reserved dead-wall zone or liability penalty system.</p><p>Further reading: <a href="https://c.tabletopia.com/games/old-hong-kong-mahjong/rules/mahjong-rules/en" target="_blank" rel="noopener noreferrer">Tabletopia-hosted Mahjong rules</a> and <a href="https://mahjlife.com/wp-content/uploads/2023/09/Cantonese-Mahjong-HKOS_Quick-Reference-EZ-Reader.pdf" target="_blank" rel="noopener noreferrer">Mahj Life’s Cantonese reference</a>. These explain conventions; Atelier’s implemented profile is the one described in these lessons. Text, examples, and code here are independently written.</p>`)
],question:'An opponent proposes upgrading an exposed Pung to a Kong. When can you take that fourth tile?',choices:['To make a Chow','Only to complete a valid winning hand','Whenever it matches a pair'],answer:1,why:'An added Kong opens a win-only claim window. A successful robbery leaves the original Pung intact and prevents the replacement draw.'},

american:{name:'American Practice',intro:'American-style mechanics with six original Atelier patterns. Learn passing, exposures, concealed hands, and Joker redemption.',lessons:[
lesson('Read an original practice card',()=>`<p>The 152-tile set contains 136 standard tiles, eight bonus tiles, and eight Jokers. Each physical wall has 19 two-tile stacks. Dealing is automatic: East gets 14 tiles, the others 13. Before passing, East checks for a complete original-card hand and may declare an immediate opening win. Your 14 tiles must match one complete practice-card row. Numbers on this card mean group sizes, not tile ranks. F means one natural Flower or Season.</p><p>Each group of three or more is one identical tile type, with Jokers permitted. Pairs and singles must be natural. On this original card, sets and Pairs use numbered suits, Winds, or Dragons. Only Bloom Festival uses Flowers/Seasons, as two individual singles; either bonus family may fill either single. These are restrictions of the Atelier rows, not a general ban on American Flower groups. There are no Chows. A highlighted goal helps planning but does not restrict which valid row can win.</p><p>The <a href="https://www.nationalmahjonggleague.org/" target="_blank" rel="noopener noreferrer">National Mah Jongg League</a> publishes an annual card. This app does not include it or claim League endorsement. Our pattern selection, values, and examples are original; the interface is not a substitute for learning an official card.</p>`),
lesson('Six rows, exposed or concealed',()=>`<ul>${M.americanTest.CARD.map(c=>`<li><strong>${c.name}: ${c.groups.map(n=>n===1?'F':n).join(' + ')}</strong>. ${c.description} ${c.concealed?'Concealed: no exposures before winning.':'Exposures allowed.'} ${c.value} original practice points.</li>`).join('')}</ul><p>Each row totals 14. A Quint is five tiles; a Sextet is six. Because a natural standard tile has only four copies, these larger groups need Jokers. A completely Joker-filled concealed group of three or more is accepted; a Joker never replaces a single or pair.</p><p>Twin Comets teaches concealed play. You may still redeem Jokers from other players’ exposures while pursuing it, because that creates no exposure of your own.</p>`),
lesson('Charleston and blind passes',()=>`<ol><li>Pass three non-Jokers Right, then Across, then Left.</li><li>After the first round, each player votes. One stop ends the Charleston; unanimous agreement starts Left, Across, Right.</li><li>On the last pass of either round, optionally forward 0–3 incoming tiles blind. Choose the remaining tiles from your own rack.</li><li>After passing, make courtesy offers across the table.</li></ol><p>Blind tiles are forwarded without showing their faces to you. Selecting two blind tiles means selecting only one rack tile. Packets resolve together; nobody sees the incoming blind tiles. When several players need blind tiles, forwarding begins with a player contributing the largest packet. <a href="https://guide.americanmahjonggassociation.com/how-to-play-american-mah-jongg/the-charleston/" target="_blank" rel="noopener noreferrer">Association Charleston reference</a> (reviewed 18 October 2026). If nobody contributes a rack tile on the final right pass, the Charleston ends and courtesy passing is skipped. On first left, no packet can start: the app asks everyone to rechoose with at least one contributed tile, keeping every rack unchanged. That first-left recovery is a disclosed interface policy, not an asserted League ruling. East can also declare at a completed three-pass round boundary; a round already started must finish. Physical-table timing windows are automated.</p><p>Keep Jokers, useful duplicates, and natural pairs. Reassess your target after receiving tiles. The computer’s second-round preference is set before the game, while human players decide after the first round.</p>`),
lesson('Negotiate the courtesy exchange',()=>`<p>Each player offers 0, 1, 2, or 3 tiles to the opposite player. The pair exchanges the smaller offer. If you offer 3 and the opposite player offers 1, each selects one tile. If either offers zero, neither sends any.</p><p>Both opposite pairs decide independently. The game shows the agreed count; select exactly that many tiles and send the packet. For zero, send the empty packet to acknowledge the pass. No Jokers and no blind forwarding are permitted in the courtesy exchange.</p><p>When courtesy passing finishes, East makes the first discard. Others then draw automatically and discard unless a claim interrupts the sequence.</p>`),
lesson('Expose with a plan',()=>`<p>A latest discard may complete a Pung, Kong, Quint, or Sextet when that exposure remains compatible with an exposed practice-card row. Your selected planning goal does not force a row; you can change direction.</p><p>The engine prevents combinations of exposed group sizes that fit no remaining row. It also excludes concealed rows from exposure-based wins. After your call, open <strong>Adjust your newly called exposure</strong>. Before discarding or redeeming a Joker, you may change this new set’s size or natural/Joker mixture. The claimed tile and its identity must stay, and the result must still fit an exposed original row. Discarding or redeeming locks it. Later, only an eligible natural-for-Joker redemption can change its tiles. Claim buttons also let you preserve a natural tile by using an available Joker instead.</p><p>You cannot call a discard merely to build a pair or single; it must complete the whole winning hand. A discarded Joker cannot be claimed. Flower/Season singles on this original card can likewise be called only for the final win. An American Kong does not draw a replacement.</p><p>Mah Jongg has priority over set claims. Competing set claims have equal priority, resolved in turn order. Invalid moves are prevented rather than penalized through tournament-style dead-hand adjudication.</p>`),
lesson('Redeem a Joker on your turn',()=>`${row('c5 c5 j','An exposed 5-Characters Pung containing a Joker.')}${row('we j','This cannot be your pair: pairs must be two natural identical tiles.')}<p>After your draw or valid set claim and before discarding, trade a natural matching rack tile for a Joker in any eligible exposure—your own or another player’s. Press the ↔ Joker button next to that exposure. The natural tile replaces the Joker; the Joker goes into your rack. Neither player gains a tile.</p><p>Redeeming is not taking a discard and does not expose your concealed hand. You may redeem more than one available Joker while it is still your turn. Exposed sets retain their tile identity after each swap.</p><p>Read more about timing and physical-table etiquette in <a href="https://guide.americanmahjonggassociation.com/how-to-play-american-mah-jongg/jokers-and-joker-exchange/" target="_blank" rel="noopener noreferrer">the American Mah Jongg Association rulebook</a>. Our app automates the physical exchange. Initiating it also locks your newly called exposure; you cannot then enlarge or shrink that set.</p>`),
lesson('Win, score, and keep learning',()=>`${row('b2 b2 j d4 d4 d4 c7 c7 c7 dr dr dr we we','Four of a Kindred: four groups of three, plus a natural East pair.')}<p>Declare Mah Jongg before discarding when the entire rack and exposures match a row. If more than one original row fits, Atelier scores the highest-value compatible row. Exposures and concealed restrictions still apply. The original card’s value is the base; a Joker-free hand doubles it. A win completed from a discard stays a discard win even if you first expose its set. Completing the hand through Joker redemption counts as self-picked. On self-draw, each opponent pays double that adjusted base. On a discard win, only the discarder pays double; the other two pay the adjusted base.</p><p>For example, Four of a Kindred with a Joker is worth base 25: a discard win receives 50 + 25 + 25 = 100. A Joker-free self-draw uses base 50 and receives 100 from each opponent. These are virtual Atelier practice points, not official annual-card values. On an official card, the Singles and Pairs category does not receive the extra Joker-free doubling: its listed value already accounts for that restriction. No annual-card rows are reproduced here.</p><p>Next hand retains scores and advances the dealer after every hand, including draws. After four hands, the original dealer (the pivot) swaps seats with the player to the right and deals the next round. Names, bot/human control, and scores move with the players. A practice match lasts 16 hands; round numbers do not create wind bonuses in American scoring. Start Guided practice to select a Charleston packet, redeem another player’s Joker, and complete a staged winning hand.</p><p>Rule and payment reference: <a href="https://guide.americanmahjonggassociation.com/how-to-play-american-mah-jongg/hand-value-and-payment/" target="_blank" rel="noopener noreferrer">American Mah Jongg Association payment rules</a>, reviewed 18 October 2026. Saved lesson markers and bookmarks remain in this browser when storage is available. They do not save your in-progress game. You can reset learning progress in the lesson window.</p>`)

    return `<aside class="guide-card"><div class="guide-kicker">THE FIELD GUIDE <span>03 / 03</span></div><h3>Play the American way.</h3><p>Build a hand matching <strong>one complete line</strong> on the original practice card. This is not an official NMJL annual card.</p><div class="tip-list"><div><span class="tip-icon">↗</span><span><b>Charleston</b><small>Pass three non-Joker tiles: Right, Across, Left. A second round needs everyone’s agreement; courtesy passing follows.</small></span></div><div><span class="tip-icon">★</span><span><b>Jokers</b><small>Use in groups of three or more, never singles or pairs.</small></span></div><div><span class="tip-icon">↔</span><span><b>Joker exchange</b><small>Trade a natural tile for a matching Joker in any eligible exposed set on your turn.</small></span></div></div><div class="guide-note">Practice blind and courtesy passes, concealed hands, exposure compatibility, and Joker exchanges. Points belong to the original Atelier card; this is not NMJL annual-card play.</div></aside>`;

  function solitaireView(){
    const g=currentGame(),positions=g.tiles,free=new Set(g.available().map(t=>t.id));
    const maxX=Math.max(...positions.map(p=>p.x)),maxY=Math.max(...positions.map(p=>p.y));
    const width=Math.max(755,110+(maxX+1)*55),height=100+(maxY+1)*69;
    const board=positions.filter(p=>!p.removed).sort((a,b)=>a.z-b.z).map(p=>{
      const enabled=free.has(p.id),tip=g.lastHint.includes(p.id),type=p.tile.type;
      return `<button type="button" title="${C.name(type)}${enabled?' · Free':' · Blocked'}" aria-label="${C.tileAccessibleName(type)}${enabled?' free':' blocked'}" ${enabled?'':'disabled'} data-act="sol-pick" data-tile-id="${p.id}" class="mj-tile board-tile layer-${p.z} ${enabled?'free':'blocked'} ${g.selected===p.id?'is-selected':''} ${tip?'is-hint':''}" style="left:${43+p.x*55-p.z*4}px;top:${37+p.y*69-p.z*7}px;z-index:${5+p.z*3};">${C.tileMarkup(type)}</button>`;
    }).join('');
    return `${panelHeader('SOLO PLAY / MATCH & CLEAR','A little peace. A lot of possibilities.','Match free tiles, uncover new paths, and clear the board at your own pace.')}
    <div class="stats-grid"><div class="stat"><span>Tiles remaining</span><strong>${g.remaining}<small> / 144</small></strong></div><div class="stat"><span>Pairs matched</span><strong>${g.moves}</strong></div><div class="stat"><span>Time in play</span><strong data-timer>${C.elapsed(Math.floor((Date.now()-g.startedAt)/1000))}</strong></div><div class="stat"><span>Best moments</span><strong>${state.stats.solitaire||0}<small> clears</small></strong></div></div>
    <div class="solitaire-settings"><div class="layout-prompt">BOARD SHAPE <span class="bullet">•</span> <span class="muted">Choose your challenge</span></div><div class="segment">${['pyramid','garden','bridge'].map(l=>`<button data-act="layout" data-layout="${l}" class="${g.layout===l?'active':''}" type="button">${({pyramid:'Pyramid',garden:'Garden',bridge:'Bridge'})[l]}</button>`).join('')}</div></div>
    <div class="board-frame"><div class="board-topline"><span>✧ &nbsp; ${g.reflowed?'RESCUE TRAY':g.layout.toUpperCase()} / LAYERED PUZZLE</span><span>144 TILES · ${g.pairs().length} PAIRS AVAILABLE</span></div><div class="board-scroller"><div class="solitaire-board" role="group" aria-label="Mahjong Solitaire board" style="width:${width}px;height:${height}px">${board}</div></div>${g.finished?'<div class="board-overlay"><div class="winning-medal">✦</div><h2>Beautifully played.</h2><p>You cleared every tile!</p>'+btn('Play again','new-sol','primary')+'</div>':''}${!g.finished&&g.pairs().length===0?'<div class="no-moves">No matching free pairs. Try Undo or Shuffle to continue.</div>':''}</div>
    <div class="toolbar">${btn('↶ &nbsp; Undo','undo','secondary',!g.undoStack.length)}${btn('◌ &nbsp; Hint','hint','secondary',g.finished)}${btn('⤨ &nbsp; Shuffle','shuffle','secondary',g.finished)}<span class="toolbar-divider"></span>${btn('✧ &nbsp; New puzzle','new-sol','primary')}</div>`;
  }
  function setupView(){
    const isAm=state.mode==='american';
    return `${panelHeader(isAm?'FOUR-PLAYER / AMERICAN RULES':'FOUR-PLAYER / HONG KONG PROFILES',isAm?'The Charleston is calling.':'Gather around the table.',isAm?'An American-style practice game with original card patterns, Jokers and tile passing.':'Build sets, call discards and race to Mahjong under your selected Hong Kong rules profile.')}${rulesProfileMarkup()}
    <div class="setup-area"><div class="setup-top"><div class="setup-emblem">${isAm?'★':'中'}</div><h2>Set the table</h2><p>Choose how you want to play. Your table runs entirely in this browser.</p></div><h3 class="setup-label">PLAY AGAINST</h3><div class="opponent-grid"><button type="button" data-act="opponents" data-value="bots" class="opponent ${state.settings.opponents==='bots'?'chosen':''}"><span class="opponent-pict">◉ ◉ ◉</span><b>You + three bots</b><small>Play on your own against computer seats</small></button><button type="button" data-act="opponents" data-value="local" class="opponent ${state.settings.opponents==='local'?'chosen':''}"><span class="opponent-pict">♟ ♟ ♟ ♟</span><b>Four players, one device</b><small>Pass the device and keep hands hidden</small></button></div>
    ${isAm?`<div class="setup-field"><label for="second-pass">Computer preference for a second Charleston</label><select id="second-pass" data-setting="secondCharleston"><option value="true" ${state.settings.secondCharleston?'selected':''}>Bots agree to a second round</option><option value="false" ${!state.settings.secondCharleston?'selected':''}>Bots decline a second round</option></select><small>Each human chooses after the first round. One “stop” ends the Charleston. Courtesy offers are then negotiated across the table.</small></div>`:`<div class="setup-field"><label for="hk-profile">Rules profile</label><select id="hk-profile" data-setting="hkProfile"><option value="atelier" ${state.settings.hkProfile==='atelier'?'selected':''}>Atelier Hong Kong · expanded play</option><option value="beginner" ${state.settings.hkProfile==='beginner'?'selected':''}>Beginner · four melds + pair</option></select><small>Atelier uses a named house profile with special hands, added/robbed Kongs, a 10-faan cap, and four wind rounds.</small></div><div class="setup-field"><label for="fan-rule">Minimum qualifying faan</label><select id="fan-rule" data-setting="minFan"><option value="0" ${!state.settings.minFan?'selected':''}>0 · learn hand shapes</option><option value="3" ${state.settings.minFan===3?'selected':''}>3 · scoring challenge</option></select><small>In Atelier, Flower bonuses do not satisfy the minimum.</small></div>${state.settings.hkProfile==='atelier'?`<div class="setup-field"><label><input type="checkbox" data-setting="flowers" ${state.settings.flowers?'checked':''}> Include eight Flowers and Seasons</label><label><input type="checkbox" data-setting="sevenPairs" ${state.settings.sevenPairs?'checked':''}> Allow seven distinct pairs (4-faan house option)</label></div>`:''}`}

    ${btn('Start a new table &nbsp; →','start-table','primary')}<p class="setup-note">✦ &nbsp; No sign-in · No server · No tracking · No bets</p></div>`;
  }
  function publicTilesMarkup(tiles,label){
    return `<div class="public-tiles" role="group" aria-label="${escapeHTML(label)}">${tiles.map(t=>`<span class="mj-tile public-tile" role="img" aria-label="${escapeHTML(C.name(t.type))}" title="${escapeHTML(C.name(t.type))}">${C.tileMarkup(t.type)}</span>`).join('')}</div>`;
  }
  function seatMarkup(p,seat,active,game){
    const special=p.seat===active?' active':'';
    const viewer=game.settings.opponents==='local'?(state.curtain===null?active:null):game.players.find(p=>!p.bot)?.seat;
    const exposed=p.melds.length?`<div class="seat-melds">${p.melds.map((m,i)=>{
      if(m.concealed&&seat!==viewer&&!(game.phase==='finished'&&game.winner===seat))return '<div class="exposed-meld">▣ CONCEALED KONG · four face-down tiles</div>';
      const jokers=m.tiles.filter(t=>t.type==='j').length;
      const composition=game.variant==='american'?`${m.tiles.length-jokers} natural · ${jokers} Joker${jokers===1?'':'s'}`:`${m.tiles.length} tiles`;
      const canExchange=jokers&&game.variant==='american'&&game.phase==='discard'&&['draw','claim','exchange'].includes(game.lastSource)&&!game.players[game.current].bot&&game.players[game.current].hand.some(t=>t.type===m.type);
      return `<div title="${escapeHTML(m.kind+' · '+C.name(m.type))}" class="exposed-meld"><div><span class="meld-icon">${m.kind==='chow'?'≋':m.kind==='kong'?'▣':'◈'}</span> ${m.concealed?'CONCEALED ':''}${escapeHTML(m.kind.toUpperCase())} <strong>${escapeHTML(C.name(m.type))}</strong></div>${publicTilesMarkup(m.tiles,m.concealed?'Your concealed Kong':'Exposed '+m.kind)}<span class="meld-composition">${composition}</span>${canExchange?`<button type="button" class="swap-btn" data-act="joker-swap" data-seat="${seat}" data-meld="${i}" title="Exchange matching tile for exposed Joker">↔ Joker</button>`:''}</div>`;
    }).join('')}</div>`:'<span class="seat-meta">No exposed sets</span>';
    const flowers=p.flowers.length?`<div class="seat-flowers"><span>Exposed Flowers / Seasons</span>${publicTilesMarkup(p.flowers,'Exposed Flowers and Seasons')}</div>`:'';
    return `<div class="seat seat-${seat}${special}"><div class="seat-heading"><span class="wind-chip">${['東','南','西','北'][game.windIndex(seat)]}</span><span><strong>${p.name} · ${game.windName(seat)}</strong><small>${p.bot?'BOT':'LOCAL PLAYER'}</small></span>${p.seat===active?'<span class="turn-pin">● TURN</span>':''}</div><div class="seat-tiles"><span>▥ ${p.hand.length} concealed</span><span>◫ ${p.discards.length} discards</span><span>✿ ${p.flowers.length} bonus tiles</span></div>${exposed}${flowers}</div>`;
  }
  function compactTile(type){
    const t={'we':'東','ws':'南','ww':'西','wn':'北','dr':'中','dg':'發','dw':'白','j':'★'};
    if(type[0]==='f')return '✿';if(t[type])return t[type];return type.slice(1)+({b:'竹',d:'●',c:'萬'}[type[0]]||'');
  }
  function pondMarkup(g){
    const thrown=[];
    for(let p of g.players)for(let d of p.discards)thrown.push({tile:d,player:p.seat});
    return `<div class="pond-head"><span>THE DISCARD POND</span><span>${g.wall.length} TILES IN THE WALL</span></div><div class="pond-tiles">${thrown.map(x=>`<span role="img" aria-label="${g.players[x.player].name}: ${C.name(x.tile.type)}" class="pond-tile ${g.lastDiscard?.tile.id===x.tile.id?'newest':''}" title="${g.players[x.player].name}: ${C.name(x.tile.type)}">${compactTile(x.tile.type)}</span>`).join('')||'<span class="pond-empty">The tiles have not yet begun to fall.</span>'}</div>`;
  }
  function handMarkup(g,active){
    const p=g.players[active];
    if(g.settings.opponents==='local'&&state.curtain!==null)return '<div class="hand-panel"><p>The private rack stays hidden until its player reveals it.</p></div>';
    if(p.bot&&!(g.phase==='finished'&&g.winner===active))return '<div class="hand-panel"><p>Computer rack is concealed. Your rack returns when it is your turn.</p></div>';
    const playable=!p.bot&&(g.phase==='discard'||g.phase==='charleston');
    if(!p)return '';
    const tiles=p.hand.map(t=>`${C.tileButton(t,{selected:(g.phase==='charleston'?state.passSelected.has(t.id):state.selected===t.id),disabled:!playable,attr:playable?`data-act="hand-pick" data-id="${t.id}"`:''})}`).join('');
    return `<div class="hand-panel"><div class="hand-title"><div><span class="eyebrow">${['charleston','secondChoice','courtesyChoice'].includes(g.phase)?'THE PASSING RACK':'CONCEALED TILES'}</span><h3>${p.name}'s hand <span>· ${p.hand.length} tiles</span></h3></div><span class="rack-symbol">${g.variant==='american'?'AMERICAN RACK':'TABLE HAND'}</span></div><div class="rack" role="group" aria-label="${p.name} player's tiles">${tiles}</div><div class="rack-hint">← Swipe or scroll the rack to see all your tiles →</div></div>`;
  }
  function cardMarkup(g){if(state.mode!=='american')return '';
    return `<div class="practice-card"><div class="practice-header"><div><p class="eyebrow">AMERICAN EDITION · ORIGINAL CONTENT</p><h3>The Atelier Practice Card</h3></div><span>6 PATTERNS</span></div><p>Complete <strong>any one entire row</strong> to declare Mah Jongg. The highlighted target is a planning aid, not a restriction.</p><div class="pattern-list">${M.americanTest.CARD.map((c,i)=>`<button type="button" data-act="goal" data-goal="${i}" class="pattern ${state.goal===i?'goal':''}"><span class="pattern-name">${escapeHTML(c.name)}<small>${c.level}</small></span><span class="pattern-blocks">${c.groups.map(n=>`<b class="pattern-group ${n<=2?'singles':''}">${n===1?'F':n}</b>`).join('')}</span><span class="pattern-desc">${escapeHTML(c.description)}</span></button>`).join('')}</div><p class="practice-disclaimer">Each number is a group size; F means a single Flower or Season. Only Bloom Festival uses Flowers/Seasons, as its two singles. All other groups use numbered suits, Winds, or Dragons. Concealed rows allow no exposed sets before the winning call. Groups of 3+ are identical tiles; a Joker can fill these groups, never a pair or single. <strong>Unofficial original learning patterns</strong>, not NMJL annual-card hands.</p></div>`;
  }
  function actionMarkup(g,active){
    if(g.phase==='finished')return `<div class="action-banner result-banner"><div><h3>${g.result.kind==='win'?g.result.message:'A peaceful draw.'}</h3><p>${g.result.kind==='win'?(g.variant==='hk'?`${g.result.analysis.fan} faan · ${g.result.analysis.details.join(' · ')||'Standard hand'}`:`${g.result.analysis.card.name} · ${g.result.analysis.card.value} base points${g.result.analysis.jokerFree?' · Joker-free ×2':''}`):g.result.message}</p><p>Practice points only. ${g.result.kind==='win'?`Each opponent pays ${g.result.base}; ${g.result.selfDraw?'all three pay double for self-draw':'the discarder pays double'}.`:''}</p></div>${btn('Next hand · keep scores →','next-hand','primary')}${btn('New match','new-table','secondary')}</div>`;
    if(g.phase==='opening'||g.phase==='passingWin')return `<div class="action-banner"><div><p class="eyebrow">EAST’S ${g.phase==='opening'?'DEALT RACK':'COMPLETED PASSING ROUND'}</p><h3>${g.canDeclareWin(active)?'A complete original-card hand.':'Check your rack before passing.'}</h3><p>${g.phase==='opening'?'East may win with the dealt hand before any Charleston. Otherwise, begin the three required passes.':'East may declare at this completed round boundary. A started three-pass round must finish first.'}</p></div><div class="action-buttons">${g.canDeclareWin(active)?btn('Declare opening Mah Jongg','win','highlight',g.players[active].bot):''}${g.phase==='opening'?btn('Begin Charleston →','begin-charleston','primary',g.players[active].bot||!!g.canDeclareWin(active)):btn('Continue passing','continue-passing','secondary',g.players[active].bot)}</div></div>`;
    if(g.phase==='blindDeadlock')return `<div class="action-banner"><div><h3>No incoming tiles exist to pass blind.</h3><p>Everyone kept their entire rack. Rechoose this first-left pass with at least one rack tile contributed to start forwarding. Nobody’s tiles have moved.</p></div>${btn('Rechoose this pass','retry-blind','primary')}</div>`;
    if(g.phase==='secondChoice')return `<div class="action-banner"><div class="action-copy"><p class="eyebrow">CHARLESTON DECISION · ${g.players[active].name}</p><h3>Continue with a second round?</h3><p>Everyone must agree. One stop takes the table to courtesy offers.</p></div><div class="action-buttons">${btn('Continue · Left, Across, Right','second-yes','primary',g.players[active].bot)}${btn('Stop after first round','second-no','secondary',g.players[active].bot)}</div></div>`;
    if(g.phase==='courtesyChoice')return `<div class="action-banner"><div class="action-copy"><p class="eyebrow">COURTESY OFFER · ${g.players[active].name}</p><h3>How many tiles would you exchange?</h3><p>You and the opposite player exchange the smaller offer. Choose zero to decline. No blind tiles or Jokers.</p></div><div class="action-buttons">${[0,1,2,3].map(n=>btn(String(n),'courtesy-offer','secondary',g.players[active].bot,`data-count="${n}"`)).join('')}</div></div>`;
    if(g.phase==='charleston'){
      const r=g.passRoute[g.charIndex],required=g.passCount(active)-state.blind;
      return `<div class="action-banner"><div class="action-copy"><div class="eyebrow">${r.courtesy?'COURTESY EXCHANGE':`CHARLESTON · PASS ${g.charIndex+1}`}</div><h3>Pass ${g.passCount(active)} tiles ${r.name.toLowerCase()}</h3><p>Select ${required} non-Joker tiles from ${g.players[active].name}'s rack.${state.blind?` The remaining ${state.blind} will be forwarded unseen from the incoming packet.`:''}</p>${g.canBlind()&&!g.players[active].bot?`<label class="blind-choice">Pass unseen: <select data-blind="true" aria-label="Number of incoming tiles to pass blind">${[0,1,2,3].map(n=>`<option value="${n}" ${state.blind===n?'selected':''}>${n} blind tile${n===1?'':'s'}</option>`).join('')}</select></label><p>If everyone keeps all their rack tiles: first left needs a new selection; final right ends passing immediately, with no courtesy pass.</p>`:''}</div><div class="action-buttons"><span class="counter-note">${state.passSelected.size}/${required} selected</span>${btn('Send passing packet →','submit-pass','primary',g.players[active].bot||state.passSelected.size!==required)}</div></div>`;
    }
    if(g.phase==='claims'||g.phase==='robkong'){
      const opts=g.offered().options;
      return `<div class="action-banner"><div class="action-copy"><div class="eyebrow">DISCARD CLAIM · ${g.players[active].name.toUpperCase()}</div><h3>${g.phase==='robkong'?'Added Kong offered:':'Someone played'} ${C.name(g.phase==='robkong'?g.pendingKong.tile.type:g.lastDiscard.tile.type)}.</h3><p>${g.phase==='robkong'?'Only a winning hand can take this tile. Passing lets the Kong receive its replacement draw.':'Claim a legal exposed set or a complete winning hand—or pass to continue.'}</p></div><div class="action-buttons claim-actions">${g.players[active].bot?'<span class="muted">Thinking…</span>':opts.map(o=>btn(o.kind==='win'?'✦ '+o.title:escapeHTML(o.title),'claim','secondary',false,`data-code="${o.code}"`)).join('')+btn('Pass','claim','ghost',false,'data-code="pass"')}</div></div>`;
    }
    const p=g.players[active],canWin=g.canDeclareWin(active),kongs=g.kongOptions?g.kongOptions(active):[];
    return `<div class="action-banner"><div class="action-copy"><div class="eyebrow">YOUR MOVE · ${p.name.toUpperCase()}</div><h3>${p.bot?'Computer is choosing a tile…':'Choose a tile to discard.'}</h3><p>${g.variant==='hk'?'Build a complete hand under your selected profile. Added Kongs may be robbed for a win.':'Only hands on the practice card win. You can redeem Jokers from exposed groups on your turn.'}</p></div><div class="action-buttons">${canWin?btn('✦ &nbsp; Declare Mahjong!','win','highlight',p.bot):''}${kongs.map(type=>btn((type.startsWith('add:')?'▣ Add to Pung · ':'▣ Concealed Kong · ')+escapeHTML(C.name(type.replace('add:',''))),'kong','secondary',p.bot,`data-type="${type}"`)).join('')}${btn('Discard '+(state.selected===null?'selected tile':'tile →'),'discard','primary',p.bot||state.selected===null)}</div></div>`;
  }
  function adjustmentMarkup(g,active){
    if(g.variant!=='american'||g.isBotSeat(active))return '';const options=g.adjustmentOptions(active);if(!options.length)return '';
    return `<details class="exposure-adjust"><summary>Adjust your newly called exposure</summary><p>Keep the claimed tile and its identity. You may change this new set’s size or natural/Joker mixture while it still fits an exposed practice row. Discarding or exchanging a Joker locks the exposure.</p><div class="path-options">${options.map(o=>btn(`${o.size} tiles · ${o.natural} natural + ${o.jokers} Jokers`,'adjust-exposure','secondary',false,`data-ids="${o.ids.join(',')}"`)).join('')}</div></details>`;
  }
  function scoreboard(g){return `<section class="match-ledger" aria-label="Match scores"><p><strong>${g.variant==='hk'?(g.expanded?'Atelier Hong Kong':'Beginner Hong Kong'):'Atelier American'}</strong> · ${g.variant==='hk'?['East','South','West','North'][g.round]+' round':'Round '+(g.round+1)} · Hand ${g.handNumber} · Dealer: ${g.players[g.dealer].name}</p><div>${g.players.map((p,i)=>`<span>${p.name} (${g.windName(i)}) <strong>${g.scores[i]}</strong>${g.result?` <small>(${g.result.payments[i]>=0?'+':''}${g.result.payments[i]})</small>`:''}</span>`).join('')}</div><small>Virtual practice points · ${g.variant==='hk'?'East repeats after winning or a draw; otherwise the dealer moves.':'Dealer moves after every hand; after four hands, the initial dealer swaps seats to the right and starts the next round.'} ${g.variant==='hk'?'Four dealer advances change the prevailing wind.':'American round numbers do not add wind-scoring bonuses.'}</small></section>`;}
  function tableView(){
    const g=currentGame();if(!g)return setupView();
    const active=g.who()??g.current;
    const subtitle=state.mode==='american'?'An original card, a little luck, and a whole lot of strategy.':'Chows, Pungs and Kongs. Every discarded tile tells a story.';
    const title=state.mode==='american'?'A distinctly American table.':'Every tile has a story.';
    return `${panelHeader((g.variant==='hk'?(g.expanded?'ATELIER HONG KONG v2':'HONG KONG BEGINNER'):'AMERICAN PRACTICE')+' / FOUR PLAYERS',title,subtitle)}${rulesProfileMarkup(g)}
      <div class="stats-grid table-stats"><div class="stat"><span>Remaining wall</span><strong>${g.wall.length}</strong></div><div class="stat"><span>Round status</span><strong class="stat-status">${['charleston','secondChoice','courtesyChoice'].includes(g.phase)?'Passing':['claims','robkong'].includes(g.phase)?'Claims open':g.phase==='finished'?'Hand ended':'In play'}</strong></div><div class="stat"><span>Active seat</span><strong>${g.windName(active)}</strong></div><div class="stat"><span>Completed games</span><strong>${state.stats[state.mode]||0}</strong></div></div>
      ${scoreboard(g)}<div class="arena"><div class="arena-label"><span>✦ THE FELT TABLE</span><span>${g.settings.opponents==='bots'?'SOLO VS. THREE BOTS':'FOUR LOCAL PLAYERS'}</span></div><div class="arena-grid"><div class="arena-seat-top">${seatMarkup(g.players[2],2,active,g)}</div><div class="arena-seat-left">${seatMarkup(g.players[3],3,active,g)}</div><div class="discard-pond">${pondMarkup(g)}</div><div class="arena-seat-right">${seatMarkup(g.players[1],1,active,g)}</div><div class="arena-seat-bottom">${seatMarkup(g.players[0],0,active,g)}</div></div></div>
      ${actionMarkup(g,active)}${handMarkup(g,active)}${adjustmentMarkup(g,active)}
      <div class="table-footer">${btn('↻ &nbsp; New hand','new-table','secondary')}${btn('⚙ &nbsp; Change table settings','change-settings','secondary')}<span class="muted">${escapeHTML(g.log[0]||'')}</span></div>${cardMarkup(g)}
      <div class="turn-history"><h3>Table notes</h3><ol>${g.log.slice(0,7).map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ol></div>`;
  }
  function privacyCurtain(){
    if(state.curtain===null)return '';
    const p=currentGame()?.players[state.curtain];if(!p)return '';
    return `<div class="curtain" role="dialog" aria-modal="true" aria-label="Private hand handoff"><div class="curtain-content"><div class="curtain-lock">♧</div><p class="eyebrow">PRIVATE HAND · ONE DEVICE</p><h2>Pass to ${p.name}.</h2><p>Other players, please look away. Only ${p.name} should see the next rack or discard opportunity.</p>${btn('I am '+p.name+' · Reveal my hand →','reveal','primary')}</div></div>`;
  }
  function render(){
    const which=state.mode;
    maybeGuard();
    root.innerHTML=`<div class="shell" ${state.curtain!==null?'inert aria-hidden="true"':''} data-tile-theme="${state.appearance.theme}" data-indices="${state.appearance.indices?'show':'hide'}">${header()}${appearanceBar()}<div class="learn-entry"><p><strong>Learn ${M.lessons[which].name}</strong><br>Choose a move. See why it helps. Compare alternatives—and discover what changes under another variant.</p><div class="learn-entry-actions">${btn('Start learning path →','path','primary')}${btn('Guided practice','practice','secondary')}${btn('Rule library','learn','ghost')}</div></div><main class="content-grid"><section class="game-main">${which==='solitaire'?solitaireView():tableView()}${coachPanel()}</section>${guide(which)}</main><footer class="footer"><span>◈ &nbsp; MAHJONG ATELIER</span><span>${offlineAccessMarkup()}</span><span>NO ACCOUNTS · NO ADS</span></footer>${tileGuide()}</div>${pop()}${privacyCurtain()}`;
    if(state.curtain!==null)root.querySelector('[data-act="reveal"]')?.focus();
    schedulePump();
  }
  function activeHumanSeat(){
    if(state.mode==='solitaire')return null;
    const g=currentGame();if(!g||g.phase==='finished')return null;
    const seat=g.who();return !g.isBotSeat(seat)?seat:null;
  }
  function maybeGuard(){
    const g=currentGame();if(state.mode==='solitaire'||!g?.settings||g.settings.opponents!=='local'||g.phase==='finished'||state.curtain!==null)return;
    const seat=activeHumanSeat();if(seat!==null&&seat!==state.lastSeat){state.curtain=seat;clearAdvice();state.review='';state.selected=null;state.passSelected.clear();state.blind=0;}
  }
  function schedulePump(){
    clearTimeout(pumpTimer);pumpTimer=null;
    if(state.learning||state.mode==='solitaire'||state.curtain!==null)return;
    const g=currentGame();if(!g||g.phase==='finished')return;
    if(g.isBotSeat(g.who()))pumpTimer=setTimeout(()=>{
      try{if(g.botStep()){
        if(g.phase==='finished'&&g.result.kind==='win')saveWin(state.mode);
        state.selected=null;state.passSelected.clear();state.blind=0;render();
      }}catch(err){notify('A table action could not complete: '+err.message);render();}
    },270);
  }
  root.addEventListener('click',e=>{
    const control=e.target.closest('[data-act]');if(!control)return;
    const act=control.dataset.act;
    try{
      if(act==='coach-hint'){requestAdvice();render();root.querySelector('.coach-panel')?.scrollIntoView({block:'nearest'});return;}
      if(act==='coach-select'){state.selected=Number(control.dataset.id);render();root.querySelector('.rack .is-selected')?.focus();return;}
      if(act==='coach-pair'){currentGame().lastHint=control.dataset.pair.split(',');render();return;}
      if(act==='path'){state.learning=true;clearTimeout(pumpTimer);M.openPath(state.mode,()=>{state.learning=false;schedulePump();control.focus();});return;}
      if(act==='practice'){state.learning=true;clearTimeout(pumpTimer);M.openPractice(state.mode,()=>{state.learning=false;schedulePump();control.focus();});return;}
      if(act==='learn'){state.learning=true;clearTimeout(pumpTimer);M.openLessons(state.mode,()=>{state.learning=false;schedulePump();control.focus();});return;}
      if(act==='switch'){switchMode(control.dataset.mode);return;}
      if(act==='toggle-guide'){state.showGuide=!state.showGuide;render();return;}
      if(act==='tile-guide'){state.showTileGuide=true;render();root.querySelector('.tile-help-close')?.focus();return;}
      if(act==='close-tile-guide'){state.showTileGuide=false;render();root.querySelector('[data-act=tile-guide]')?.focus();return;}
      if(act==='layout'){clearAdvice();state.review='';state.games.solitaire.newGame(control.dataset.layout);render();return;}
      if(act==='sol-pick'){
        const g=state.games.solitaire,before=g.available().map(t=>t.id),action=g.choose(control.dataset.tileId);
        if(state.teaching&&action.action==='match'){const n=g.available().filter(t=>!before.includes(t.id)).length;state.review=`Legal pair removed; ${n} previously blocked tile${n===1?' is':'s are'} now free. Look at those new choices before taking another pair.`;clearAdvice();}
        if(action.action==='match'&&action.completed){g.finishedSeconds=Math.floor((Date.now()-g.startedAt)/1000);saveWin('solitaire');notify('You cleared the board!');}
        if(action.action==='nomatch')notify('Those tiles do not match. Try another pair.');render();return;
      }
      if(act==='new-sol'){clearAdvice();state.review='';state.games.solitaire.newGame();render();return;}
      if(act==='undo'){clearAdvice();state.review='The previous pair has been restored. Compare another choice.';if(state.games.solitaire.undo())notify('The last pair is back.');render();return;}
      if(act==='hint'){if(!state.games.solitaire.hint().length)notify('No match available. Shuffle or Undo to continue.');render();return;}
      if(act==='shuffle'){clearAdvice();state.review='The remaining board has been reshuffled. Previous comparisons no longer apply.';if(state.games.solitaire.reshuffle())notify(state.games.solitaire.reflowed?'Remaining tiles reorganized into an open rescue layout. Undo history cleared.':'Remaining tiles reshuffled into a solvable arrangement. Undo history cleared.');render();return;}
      if(act==='opponents'){state.settings.opponents=control.dataset.value;render();return;}
      if(act==='start-table'||act==='new-table'){
        const g=state.mode==='hongkong'?new M.HongKongTable(state.settings):new M.AmericanTable(state.settings);
        clearAdvice();state.review='';state.games[state.mode]=g;state.blind=0;state.curtain=null;state.lastSeat=-1;state.selected=null;state.passSelected.clear();render();return;
      }
      if(act==='next-hand'){const next=currentGame().nextHand();if(!next){notify((state.mode==='hongkong'?'Four wind rounds':'Four rounds')+' complete! Start a new match when ready.');render();return;}clearAdvice();state.review='';state.games[state.mode]=next;state.curtain=null;state.lastSeat=-1;state.selected=null;state.blind=0;state.passSelected.clear();render();return;}
      if(act==='change-settings'){clearAdvice();state.review='';state.games[state.mode]=null;state.curtain=null;state.lastSeat=-1;render();return;}
      if(act==='reveal'){state.lastSeat=state.curtain;state.curtain=null;render();return;}
      const g=currentGame();if(!g)return;
      if(state.curtain!==null)return;
      if(act==='begin-charleston'){g.beginCharleston();render();return;}
      if(act==='continue-passing'){g.continuePassing();render();return;}
      if(act==='retry-blind'){g.retryBlindPass();state.passSelected.clear();state.blind=0;render();return;}
      if(act==='adjust-exposure'){g.adjustExposure(g.current,control.dataset.ids.split(',').map(Number));clearAdvice();state.selected=null;state.review='The new exposure changed. Its claimed tile stays, and it still fits an exposed practice row.';render();return;}
      if(act==='second-yes'||act==='second-no'){g.chooseSecond(g.charSeat,act==='second-yes');state.blind=0;render();return;}
      if(act==='courtesy-offer'){g.chooseCourtesy(g.charSeat,+control.dataset.count);render();return;}
      if(act==='goal'){state.goal=Number(control.dataset.goal);render();return;}
      if(act==='hand-pick'){
        const id=+control.dataset.id;
        if(g.phase==='charleston'){
          const tile=g.players[g.charSeat].hand.find(t=>t.id===id);
          if(tile?.type==='j'){notify('Jokers cannot be passed during the Charleston.');render();return;}
          if(state.passSelected.has(id))state.passSelected.delete(id);else if(state.passSelected.size<g.passCount(g.charSeat)-state.blind)state.passSelected.add(id);else notify('You have selected all required tiles for this pass.');
        }else state.selected=state.selected===id?null:id;
        render();return;
      }
      if(act==='submit-pass'){g.submitPass(g.charSeat,[...state.passSelected],state.blind);state.blind=0;state.passSelected.clear();state.selected=null;render();return;}
      if(act==='discard'){if(state.selected===null){notify('Select a tile from your rack first.');render();return;}const chosen=state.teaching?M.coach.alternatives(M.coach.publicView(g,g.current)).find(a=>a.id===state.selected||a.type===g.players[g.current].hand.find(t=>t.id===state.selected)?.type):null;g.discard(g.current,state.selected);if(chosen)state.review=`You discarded ${C.name(chosen.type)}. ${chosen.calculation} ${chosen.heuristic}`;clearAdvice();state.selected=null;render();return;}
      if(act==='claim'){const code=control.dataset.code;const explanation=M.coach.actionRule(g,g.offered().seat)+(g.variant==='hk'&&g.expanded&&code!=='win'&&g.offered().options.some(o=>o.kind==='win')?' Declining this win blocks another win on the same discarded tile type until your own next draw.':'');g.submitClaim(g.offered().seat,code);if(state.teaching)state.review=(code==='pass'?'You passed the claim. ':'Your legal claim was submitted. ')+explanation;clearAdvice();state.selected=null;render();return;}
      if(act==='win'){g.declareWin(g.current,true);clearAdvice();saveWin(state.mode);render();return;}
      if(act==='kong'){g.declareKong(g.current,control.dataset.type);clearAdvice();state.selected=null;state.review='The Kong changes your hand and may open a winning claim for an opponent. Request a fresh hint after its replacement draw.';render();return;}
      if(act==='joker-swap'){g.exchangeJoker(g.current,+control.dataset.seat,+control.dataset.meld);clearAdvice();state.selected=null;state.review='The natural tile is now exposed and the redeemed Joker is in your rack. Compare your new options before discarding.';notify('Joker redeemed! The exposed set still has its original tile value.');render();return;}
    }catch(err){notify(err.message);render();}
  });
  root.addEventListener('change',e=>{
    if(e.target.dataset.teaching){state.teaching=e.target.checked;try{localStorage.setItem('mahjong-atelier-teaching',state.teaching?'on':'off');}catch{}clearAdvice();render();return;}
    if(e.target.dataset.appearance==='theme'){
      if(THEMES.some(([id])=>id===e.target.value))state.appearance.theme=e.target.value;
      saveAppearance();render();return;
    }
    if(e.target.dataset.appearance==='indices'){
      state.appearance.indices=e.target.checked;saveAppearance();render();return;
    }
    if(e.target.dataset.blind){state.blind=Number(e.target.value);state.passSelected.clear();render();return;}
    const key=e.target.dataset.setting;if(!key)return;
    if(key==='secondCharleston')state.settings.secondCharleston=e.target.value==='true';
    if(key==='hkProfile')state.settings.hkProfile=e.target.value;
    if(key==='flowers'||key==='sevenPairs')state.settings[key]=e.target.checked;
    if(key==='minFan')state.settings.minFan=Number(e.target.value);
    render();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.showTileGuide){state.showTileGuide=false;render();root.querySelector('[data-act=tile-guide]')?.focus();}});
  timerInterval=setInterval(()=>{
    if(state.mode!=='solitaire')return;
    const t=state.games.solitaire;
    const cell=document.querySelector('[data-timer]');if(cell)cell.textContent=C.elapsed(t.finishedSeconds??Math.floor((Date.now()-t.startedAt)/1000));
  },1000);
  render();
})(globalThis.Mahjong=globalThis.Mahjong||{});


</script>
